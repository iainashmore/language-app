# Builds the iOS app on a Mac whenever it or the shared word list changes, so a
# broken build shows up here rather than the next time someone opens Xcode.
name: iOS app

on:
  push:
    paths: ['ios/**', 'content/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'content/**', '.github/workflows/ios.yml']

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Build for the iOS simulator
        run: >
          xcodebuild build
          -project ios/MongolianWords.xcodeproj
          -scheme MongolianWords
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          -derivedDataPath build
      # The app cannot start without the shared word list, so make sure Xcode
      # copied it in from content/.
      - name: Check the word list made it into the app
        run: |
          app=build/Build/Products/Debug-iphonesimulator/MongolianWords.app
          ls "$app"
          test -f "$app/words.json"
          test -f "$app/alphabet.json"
          test ! -f "$app/README.md"
